# Bagimlilik/arac manifestosu — Node tarafindaki `package.json` karsiligi.
# Kilitli surumler `requirements.txt` dosyasinda (package-lock.json karsiligi).

[project]
name = "benim-cildim-backend"
version = "1.0.0"
description = "Benim Cildim — Faz 1 auth ve rutin gecmisi backend'i (FastAPI + SQLAlchemy + SQLite)."
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.128,<1.0",
    "uvicorn[standard]>=0.39,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.16,<2.0",
    "pydantic>=2.13,<3.0",
    "email-validator>=2.3,<3.0",
    "pyjwt>=2.14,<3.0",
    "bcrypt>=5.0,<6.0",
    "python-dotenv>=1.2,<2.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
