# Alembic yapilandirmasi — Prisma Migrate'in karsiligi.
# Veritabani adresi bilerek burada YAZILI DEGIL: `alembic/env.py` onu
# `app.config` uzerinden .env dosyasindan okur, boylece uygulama ve
# migration'lar tek bir kaynaktan besleniyor.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
